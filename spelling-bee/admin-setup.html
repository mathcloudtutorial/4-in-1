<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial Admin Setup | MathCloud</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="spelling.css"><meta name="robots" content="noindex,nofollow"></head><body class="mq"><header class="nav"><a class="brand" href="index.html"><span class="mc-logo"><img src="logo.png" alt=""></span><span>MathCloud <small>INITIAL ADMIN SETUP</small></span></a></header><main class="mq-wrap"><section class="mq-card"><span class="eyebrow">One-time setup</span><h1>Create the first administrator</h1><p class="mq-muted">Enter the administrator name, email and password. This only works while no spelling administrator exists. After setup, delete this file from your hosting.</p><form id="setupForm" class="mq-form"><div><label>Administrator full name</label><input id="name" required autocomplete="name"></div><div><label>Administrator email</label><input id="email" type="email" required autocomplete="email"></div><div><label>Password (at least 8 characters)</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div><label>Confirm password</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn primary">Create administrator account</button><p id="msg" class="mq-msg" role="status"></p></form><p><a href="spelling-admin.html">Go to administrator login</a></p></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="admin-setup.js"></script></body></html>
